name: Fib Structure Signals

# Interim: GitHub keeps running the bot (OANDA data) until the VPS is live.
# Once the VPS sends its first status message, this schedule gets switched
# off so signals are not sent twice. "Run workflow" = status check only.

on:
  schedule:
    - cron: '5,25,45 * * * 1-5'
  workflow_dispatch:

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # remembers which signals were already sent, so nothing repeats
      - name: Restore bot memory
        uses: actions/cache/restore@v4
        with:
          path: bot_state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - run: pip install requests
      - run: python fib_structure_bot.py
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save bot memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bot_state.json
          key: bot-state-${{ github.run_id }}
