name: Fib Structure Signals (manual status check)

# The bot runs on the Vultr server every minute. The schedule here is
# switched off so signals are never sent twice. "Run workflow" still
# sends a status read to Telegram without sending or recording signals.

on:
  workflow_dispatch:

jobs:
  status-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python fib_structure_bot.py --report
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
