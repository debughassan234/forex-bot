name: Backtest - FundedNext 2-Step simulation

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'First date of data (YYYY-MM-DD)'
        default: '2015-01-01'

permissions:
  contents: write

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python prop_sim.py
        env:
          SIM_START: ${{ inputs.start }}
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save results
        if: always()
        run: |
          [ -f prop_sim_results.txt ] || exit 0
          cp prop_sim_results.txt /tmp/results.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan prop-sim-results
          git rm -rq --cached . >/dev/null 2>&1 || true
          cp /tmp/results.txt prop_sim_results.txt
          git add prop_sim_results.txt
          git commit -qm "FundedNext 2-Step simulation results"
          git push -f origin prop-sim-results
