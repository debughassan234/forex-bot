name: Backtest - timeframe stacks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stacks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python backtest_stacks.py
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # keep the full table in the repo (separate branch, so main stays clean)
      - name: Save results
        if: always()
        run: |
          [ -f backtest_stacks_results.txt ] || exit 0
          cp backtest_stacks_results.txt /tmp/results.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin backtest-results || true
          git checkout -B backtest-results
          git rm -rq --cached . >/dev/null 2>&1 || true
          cp /tmp/results.txt backtest_stacks_results.txt
          git add backtest_stacks_results.txt
          git commit -qm "Timeframe stack test results" || true
          git push -f origin backtest-results
