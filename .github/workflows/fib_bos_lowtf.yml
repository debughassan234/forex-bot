name: Backtest - pure fib + BOS on 5m and 15m

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python fib_bos_lowtf.py
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save results
        if: always()
        run: |
          [ -f fib_bos_lowtf_results.txt ] || exit 0
          cp fib_bos_lowtf_results.txt /tmp/results.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan lowtf-results
          git rm -rq --cached . >/dev/null 2>&1 || true
          cp /tmp/results.txt fib_bos_lowtf_results.txt
          git add fib_bos_lowtf_results.txt
          git commit -qm "Pure fib + BOS 5m/15m results"
          git push -f origin lowtf-results
